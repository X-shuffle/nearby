services:
  nearby:
    build: .
    restart: unless-stopped
    ports:
      - "${ORIGIN_HTTP_PORT:-15789}:15789"
    environment:
      ADDR: ":15789"
      # Generated by deploy.sh from Cloudflare's official IPv4/IPv6 lists.
      TRUSTED_PROXIES: "${CLOUDFLARE_TRUSTED_PROXIES:?请先执行 ./deploy.sh init}"
      STUN_URLS: "${STUN_URLS:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:15789/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
